<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>顧客情報照会システム Mock - Pages Proof</title>
    <style>
      :root {
        color-scheme: light;
        --brand: #d71920;
        --ink: #1e2528;
        --muted: #667176;
        --line: #d9e0e3;
        --surface: #f6f8f8;
        --panel: #ffffff;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        font-family:
          "Yu Gothic UI",
          "Meiryo",
          sans-serif;
        background: var(--surface);
        color: var(--ink);
        display: grid;
        place-items: center;
        padding: 24px;
      }

      .phone {
        width: min(100%, 390px);
        min-height: 720px;
        background: var(--panel);
        border: 1px solid var(--line);
        border-radius: 28px;
        box-shadow: 0 24px 60px rgba(20, 35, 40, 0.16);
        overflow: hidden;
      }

      .bar {
        height: 44px;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 12px;
        color: var(--muted);
        border-bottom: 1px solid var(--line);
      }

      main {
        padding: 20px;
        display: grid;
        gap: 18px;
      }

      .eyebrow {
        color: var(--brand);
        font-size: 12px;
        font-weight: 700;
        letter-spacing: 0;
      }

      h1 {
        margin: 0;
        font-size: 24px;
        line-height: 1.25;
      }

      p {
        margin: 0;
        color: var(--muted);
        line-height: 1.65;
        font-size: 14px;
      }

      .customer {
        border: 1px solid var(--line);
        border-radius: 14px;
        padding: 16px;
        display: grid;
        gap: 12px;
      }

      .status {
        width: fit-content;
        border-radius: 999px;
        padding: 5px 10px;
        color: var(--brand);
        background: #fff0f1;
        font-size: 12px;
        font-weight: 700;
      }

      dl {
        margin: 0;
        display: grid;
        gap: 10px;
      }

      .row {
        display: flex;
        justify-content: space-between;
        gap: 16px;
        font-size: 14px;
      }

      dt {
        color: var(--muted);
      }

      dd {
        margin: 0;
        font-weight: 700;
        text-align: right;
      }

      .tabs {
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        border-top: 1px solid var(--line);
        background: #fbfcfc;
      }

      .tab {
        padding: 12px 4px;
        text-align: center;
        font-size: 12px;
        color: var(--muted);
      }

      .tab.active {
        color: var(--brand);
        font-weight: 700;
      }
    </style>
  </head>
  <body>
    <section class="phone" aria-label="スマホ表示の確認">
      <div class="bar">GitHub Pages publish proof / Demo data only</div>
      <main>
        <div>
          <div class="eyebrow">顧客情報照会システム Mock</div>
          <h1>現場で顧客情報をすばやく確認</h1>
        </div>
        <p>
          このページはGitHub Pages公開検証用の最小Mockです。実データ、社内情報、認証情報は含みません。
        </p>
        <article class="customer">
          <div class="status">参照専用 / サンプル</div>
          <h2 style="margin: 0; font-size: 20px">サンプル 太郎 様</h2>
          <dl>
            <div class="row">
              <dt>顧客コード</dt>
              <dd>C-000001</dd>
            </div>
            <div class="row">
              <dt>最終連携</dt>
              <dd>2026/06/17 08:00</dd>
            </div>
            <div class="row">
              <dt>直近検針</dt>
              <dd>32.8 m3</dd>
            </div>
            <div class="row">
              <dt>入金状態</dt>
              <dd>確認済</dd>
            </div>
          </dl>
        </article>
      </main>
      <nav class="tabs" aria-label="顧客情報タブ">
        <div class="tab active">顧客</div>
        <div class="tab">検針</div>
        <div class="tab">機器</div>
        <div class="tab">入金</div>
      </nav>
    </section>
  </body>
</html>
